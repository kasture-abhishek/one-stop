      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
    <linearGradient id="inner" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#FF4A00"/>
